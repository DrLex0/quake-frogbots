// All the ZTNDM maps (by Sten Uusvali)
alias nm_ztndm1 "cmd fb_nm ztndm2"
alias nm_ztndm2 "cmd fb_nm ztndm3"
alias nm_ztndm3 "cmd fb_nm ztndm4"
alias nm_ztndm4 "cmd fb_nm ztndm5"
alias nm_ztndm5 "cmd fb_nm ztndm6"
alias nm_ztndm6 "cmd fb_nm ztndm1"

echo "ZTNDM maplist ready, jump in with 'map ztndm1' up to 6"
